services:
  homestead:
    # Updates kommen aus der Registry: `docker compose pull && docker compose up -d`.
    # `build: .` bleibt als Fallback, falls jemand lokal aus dem Quellcode bauen will
    # (`docker compose build`); ohne vorhandenes Image baut `up` dann von selbst.
    image: ghcr.io/yatheria030/homestead:${HOMESTEAD_TAG:-latest}
    build: .
    container_name: homestead
    restart: unless-stopped
    environment:
      # SQLite-Datei im Volume - Backup = diese Datei kopieren
      DATABASE_URL: sqlite:////data/homestead.db
      SEED_ON_START: ${SEED_ON_START:-true}
      # Snapshots: alle X Stunden automatisch, die letzten N automatischen bleiben
      BACKUP_DIR: /data/backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Scanner: Token fuer die Station, Produktsuche und optionaler KI-Schritt
      SCAN_TOKEN: ${SCAN_TOKEN:-}
      PRODUCT_LOOKUP: ${PRODUCT_LOOKUP:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_RESOLVER: ${AI_RESOLVER:-true}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_AUTO_ASSIGN: ${AI_AUTO_ASSIGN:-0.85}
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    ports:
      - "${WEB_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
