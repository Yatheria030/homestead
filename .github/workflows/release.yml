name: Release

on:
  push:
    tags: ["v*"]

# Zwei gleichzeitig laufende Image-Builds schreiben in denselben
# Actions-Cache (cache-to: type=gha) und blockieren sich gegenseitig - bei
# zwei Tags kurz nacheinander blieb ein Lauf endlos im Build-Schritt hängen.
# Also der Reihe nach statt parallel; abbrechen wäre falsch, jeder Tag soll
# sein Image bekommen.
concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release anlegen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Version ist das Tag ohne v-Prfix, z. B. 0.7.8. Kein Heredoc: der
          # Abschluss darf dabei nur an Spalte 0 stehen und zerrt dann gegen
          # die Blockskala
          VERSION="${TAG#v}"
          SECTION="$(python3 - "$VERSION" <<'PYEOF'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(
              r"## \[" + re.escape(sys.argv[1]) + r"\]( – [^\n]*)?\n(.*?)(?=\n## \[|\n\[|\Z)",
              text,
              re.S,
          )
          print(m.group(2).strip() if m else "Kein Changelog-Eintrag vorhanden.", end="")
          PYEOF
          )"
          # Ueberschreiben erlaubt: schon vorhanden und neu getaggt ist kein
          # Fehlerfall, sondern eine Korrektur
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes "$SECTION" || true
          else
            gh release create "$TAG" --title "$VERSION" --notes "$SECTION" --latest
          fi

  image:
    name: Container image veröffentlichen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance-Attestation pusht ein zusaetzliches Referrer-Artefakt in die
          # Registry - das scheitert bei privaten GHCR-Paketen zuverlaessig mit
          # "denied: permission_denied: read_package", unabhaengig von den sonstigen
          # Rechten. Wird hier nicht gebraucht, also ausgeschaltet.
          provenance: false
          sbom: false
