name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  container:
    name: Container bauen und starten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t homestead:ci .
      - name: Starten und API prüfen
        run: |
          docker run -d --name homestead -p 8000:8000 homestead:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "API erreichbar"
              curl -fsS http://localhost:8000/api/summary | head -c 200
              exit 0
            fi
            sleep 2
          done
          echo "API kam nicht hoch"; docker logs homestead; exit 1
